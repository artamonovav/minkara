# Марки, модели и разделы для архивации.
#
# Добавление новой марки = добавить блок в brands и (при необходимости)
# правила поколений в config/generations.yaml. Код менять не нужно.
#
# generations — какие поколения включать (пустой список = все).
# Поколение определяется по коду кузова (型式) из профиля машины,
# см. config/generations.yaml. Сейчас собираем все годы Freed.

brands:
  honda:
    name: Honda
    models:
      - key: freed
        name: Honda Freed
        generations: []
      - key: freed_hybrid
        name: Honda Freed Hybrid
        generations: []
      - key: freed_plus
        name: Honda Freed Plus
        generations: []
      - key: freed_plus_hybrid
        name: Honda Freed Plus Hybrid
        generations: []
      - key: freed_spike
        name: Honda Freed Spike
        generations: []
      - key: freed_spike_hybrid
        name: Honda Freed Spike Hybrid
        generations: []

sections:
  note:
    enabled: true
    title: 整備手帳
  partsreview:
    enabled: true
    title: パーツレビュー
  review:
    enabled: true
    title: クルマレビュー
  photo:
    enabled: false
    title: フォト
  qa:
    enabled: true
    title: Q&A
